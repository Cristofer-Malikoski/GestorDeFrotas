# Front-end Fretuno: valida em PRs e publica a demonstração no GitHub Pages.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Publicação (o job deploy só roda nestes casos):
#   - automática a cada push em main que toque frontend/;
#   - manual (Actions → este workflow → Run workflow), em qualquer branch permitida pelas
#     regras do ambiente "github-pages" (Settings → Environments → github-pages).
name: Front-end — CI e GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pages.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (demonstração com adapter mock)
        run: npm run build
        env:
          # Publicado em https://<usuario>.github.io/<repositorio>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: mock

      - name: Conferir saída para hospedagem estática
        run: |
          grep -q 'src="/${{ github.event.repository.name }}/assets/' dist/index.html
          test -f dist/404.html
          test -f dist/gestor/relatorios/index.html
          test -f dist/motorista/abastecer/index.html
          test -n "$(ls dist/images/*.avif)"

      - name: Empacotar para o Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
